<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="65%" stop-color="#020812"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18d8ff"/>
      <stop offset="48%" stop-color="#087cff"/>
      <stop offset="100%" stop-color="#1646e8"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d8dce3"/>
      <stop offset="100%" stop-color="#8e97a6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="600" cy="600" r="590" fill="url(#bg)"/>
  <circle cx="600" cy="600" r="566" fill="none" stroke="#17283c" stroke-width="4"/>
  <circle cx="600" cy="600" r="548" fill="none" stroke="url(#blue)" stroke-width="8" filter="url(#glow)"/>

  <!-- AW monogram -->
  <path d="M290 490 L430 230 L570 490 L510 490 L470 410 L390 410 L350 490 Z"
        fill="url(#silver)"/>
  <path d="M385 390 L430 315 L475 390" fill="none" stroke="#fff" stroke-width="20" opacity=".55"/>
  <path d="M510 500 L620 380 L690 485 L785 300 L830 300 L735 555 L680 555 L620 465 L555 555 Z"
        fill="url(#blue)"/>

  <!-- code mark -->
  <circle cx="325" cy="430" r="58" fill="#020914" stroke="#0caaff" stroke-width="3"/>
  <path d="M300 410 L278 430 L300 450 M350 410 L372 430 L350 450 M337 400 L313 460"
        fill="none" stroke="#12bfff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pixel trail -->
  <g fill="#10cfff">
    <rect x="825" y="275" width="22" height="22"/>
    <rect x="855" y="245" width="30" height="30"/>
    <rect x="895" y="220" width="18" height="18"/>
    <rect x="875" y="285" width="16" height="16"/>
    <rect x="920" y="255" width="24" height="24"/>
    <rect x="950" y="215" width="12" height="12"/>
  </g>

  <!-- Name -->
  <text x="600" y="665" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800"
        letter-spacing="2">
    <tspan fill="#ffffff">ABDUL </tspan><tspan fill="url(#blue)">WAHID</tspan>
  </text>

  <!-- Subtitle -->
  <line x1="165" y1="710" x2="285" y2="710" stroke="#09bfff" stroke-width="5"/>
  <line x1="915" y1="710" x2="1035" y2="710" stroke="#09bfff" stroke-width="5"/>
  <text x="600" y="725" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="30"
        font-weight="500" letter-spacing="10" fill="#f4f6f8">FULLSTACK DEVELOPER</text>

  <!-- Tech badges -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <g transform="translate(245 815)">
      <circle r="42" fill="none" stroke="#16d9ff" stroke-width="6"/>
      <ellipse rx="42" ry="16" fill="none" stroke="#16d9ff" stroke-width="5"/>
      <ellipse rx="42" ry="16" transform="rotate(60)" fill="none" stroke="#16d9ff" stroke-width="5"/>
      <ellipse rx="42" ry="16" transform="rotate(-60)" fill="none" stroke="#16d9ff" stroke-width="5"/>
      <circle r="6" fill="#16d9ff"/>
    </g>
    <g transform="translate(365 815)">
      <circle r="42" fill="#050a12" stroke="#e8edf5" stroke-width="3"/>
      <text y="13" font-size="34" fill="#fff">N</text>
    </g>
    <g transform="translate(485 815)">
      <rect x="-38" y="-38" width="76" height="76" rx="8" fill="#1677d2"/>
      <text y="13" font-size="28" fill="#fff">TS</text>
    </g>
    <g transform="translate(605 815)">
      <path d="M0 -44 L38 -22 L38 22 L0 44 L-38 22 L-38 -22 Z" fill="none" stroke="#63d52b" stroke-width="6"/>
      <text y="12" font-size="26" fill="#63d52b">JS</text>
    </g>
    <g transform="translate(725 815)">
      <text y="14" font-size="48" fill="#ffd43b">🐍</text>
    </g>
    <g transform="translate(845 815)">
      <path d="M-36 -8 Q-5 -42 30 -10 Q48 18 17 32 Q-18 42 -36 18 Q-50 2 -36 -8Z"
            fill="none" stroke="#e8edf5" stroke-width="5"/>
      <circle cx="-13" cy="0" r="4" fill="#e8edf5"/><circle cx="15" cy="4" r="4" fill="#e8edf5"/>
    </g>
    <g transform="translate(965 815)">
      <path d="M0 -40 C28 -18 28 22 0 42 C-28 22 -28 -18 0 -40Z" fill="#43a52b"/>
      <path d="M0 -40 C10 -10 10 18 0 42" fill="none" stroke="#9be56b" stroke-width="4"/>
    </g>
  </g>

  <!-- Cloud / Docker small marks -->
  <g transform="translate(530 900)">
    <path d="M-34 12 Q-38 -20 -8 -22 Q6 -48 30 -28 Q52 -30 55 -5 Q72 -5 78 12 Q65 30 38 28 H-20 Q-42 27 -34 12Z"
          fill="none" stroke="#1da1ff" stroke-width="6"/>
  </g>
  <g transform="translate(670 900)" fill="#25a9f0">
    <rect x="-38" y="-15" width="14" height="14"/><rect x="-20" y="-15" width="14" height="14"/>
    <rect x="-2" y="-15" width="14" height="14"/><rect x="16" y="-15" width="14" height="14"/>
    <rect x="-29" y="2" width="14" height="14"/><rect x="-11" y="2" width="14" height="14"/>
    <rect x="7" y="2" width="14" height="14"/>
    <path d="M-45 20 H35 Q55 20 62 5 Q48 8 39 0 H-45Z"/>
  </g>

  <!-- Motto -->
  <text x="600" y="1010" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="28"
        font-weight="500" letter-spacing="9" fill="#ffffff">
    BUILD  •  DEPLOY  •  SCALE
  </text>
  <text x="600" y="958" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="42"
        font-weight="700" fill="url(#blue)">&lt;/&gt;</text>

  <!-- subtle bottom accent -->
  <path d="M360 1050 Q600 1080 840 1050" fill="none" stroke="#087cff" stroke-width="3" opacity=".7"/>
</svg>